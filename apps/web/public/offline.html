<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131d">
  <meta name="description" content="بازی آفلاین مار WARGO؛ بدون نیاز به اینترنت.">
  <title>WARGO — حالت آفلاین</title>
  <link rel="icon" href="./wargo-offline.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#10131d;color:#f5f6fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.2),transparent 52%),#10131d}
    .shell{width:min(100%,480px);text-align:center}
    .brand{display:inline-block;margin-bottom:9px;color:#d9ccff;font-size:23px;font-weight:1000;letter-spacing:4px;text-shadow:0 3px 18px #7652d566}
    .offline-tag{display:inline-flex;align-items:center;gap:7px;margin:0 auto 15px;padding:7px 12px;border:1px solid #f0b45a44;border-radius:999px;background:#f0b45a12;color:#ffd18a;font-size:11px}
    .dot{width:7px;height:7px;border-radius:50%;background:#f0b45a;box-shadow:0 0 10px #f0b45a}
    h1{margin:0 0 7px;font-size:clamp(23px,6vw,30px);font-weight:900}
    .sub{margin:0 0 20px;color:#a6abc0;font-size:12px;line-height:2}
    .game-card{padding:14px;border:1px solid #ffffff16;border-radius:22px;background:linear-gradient(145deg,#1c2232,#171b29);box-shadow:0 24px 70px #0006}
    .stats{display:flex;justify-content:space-between;gap:10px;margin:0 2px 12px}
    .stat{flex:1;padding:9px 10px;border:1px solid #ffffff10;border-radius:12px;background:#ffffff06}
    .stat span{display:block;color:#9da4ba;font-size:10px;margin-bottom:5px}
    .stat strong{font-size:20px;font-variant-numeric:tabular-nums;color:#e4dcff}
    canvas{display:block;width:100%;height:auto;aspect-ratio:1;border:1px solid #ffffff12;border-radius:15px;background:#111827;touch-action:none}
    .actions{display:flex;gap:9px;margin-top:12px}
    button,.back{min-height:45px;border:0;border-radius:12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
    #start{flex:1;background:linear-gradient(135deg,#c4b5fd,#8b5cf6);color:#171322}
    #back{padding:0 15px;border:1px solid #ffffff20;background:#ffffff08;color:#e8e4f5;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .status{min-height:25px;margin:11px 0 2px;color:#b9b2d1;font-size:11px}
    .controls{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);justify-content:center;gap:6px;margin:12px auto 0}
    .controls button{min-height:42px;border:1px solid #ffffff17;background:#ffffff08;color:#e8e1ff;font-size:17px;touch-action:manipulation}
    .controls button:active{background:#a78bfa33}
    .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
    .foot{margin-top:16px;color:#777f96;font-size:10px;line-height:1.9}
    @media(min-width:600px){.shell{width:min(100%,450px)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">WARGO</div>
    <div class="offline-tag"><i class="dot"></i> حالت آفلاین</div>
    <h1>اینترنت نیست؟ بازی هست!</h1>
    <p class="sub">تا وقتی اتصال برگرده، مار WARGO منتظرته.</p>
    <section class="game-card" aria-label="بازی مار آفلاین">
      <div class="stats">
        <div class="stat"><span>امتیاز</span><strong id="score">۰</strong></div>
        <div class="stat"><span>بهترین رکورد این دستگاه</span><strong id="best">۰</strong></div>
      </div>
      <canvas id="board" width="420" height="420" aria-label="صفحه بازی مار"></canvas>
      <div class="actions">
        <button id="start" type="button">شروع بازی</button>
        <a id="back" class="back" href="./">بازگشت به WARGO</a>
      </div>
      <p class="status" id="status" aria-live="polite">برای شروع، دکمه را بزن.</p>
      <div class="controls" aria-label="کنترل لمسی بازی">
        <button class="up" data-dir="up" type="button" aria-label="بالا">↑</button>
        <button class="left" data-dir="left" type="button" aria-label="چپ">←</button>
        <button class="down" data-dir="down" type="button" aria-label="پایین">↓</button>
        <button class="right" data-dir="right" type="button" aria-label="راست">→</button>
      </div>
    </section>
    <p class="foot">این بازی کاملاً روی دستگاهت اجرا می‌شود.<br>امتیازهای این حالت وارد رتبه‌بندی اصلی WARGO نمی‌شوند.</p>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const statusEl = document.getElementById("status");
      const startButton = document.getElementById("start");
      const size = 21, cell = 20;
      const bestKey = "wargo:offline-snake-best";
      let snake, food, direction, nextDirection, score, timer, running = false, ended = false;
      const fa = value => new Intl.NumberFormat("fa-IR").format(value);
      let best = 0;
      try { best = Number(localStorage.getItem(bestKey) || 0) || 0; } catch {}
      bestEl.textContent = fa(best);

      function placeFood() {
        let point;
        do { point = {x:Math.floor(Math.random()*size), y:Math.floor(Math.random()*size)}; }
        while (snake.some(part => part.x===point.x && part.y===point.y));
        return point;
      }
      function draw() {
        ctx.fillStyle = "#111827"; ctx.fillRect(0,0,420,420);
        ctx.strokeStyle = "rgba(255,255,255,.035)"; ctx.lineWidth = 1;
        for(let i=1;i<size;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,420);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(420,i*cell);ctx.stroke();}
        ctx.fillStyle = "#ff7187"; ctx.shadowColor = "#ff7187"; ctx.shadowBlur = 14;
        ctx.beginPath();ctx.arc(food.x*cell+10,food.y*cell+10,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
        snake.forEach((part,index)=>{
          const inset=index===0?2:3;
          ctx.fillStyle=index===0?"#c4b5fd":"#8b72d8";
          ctx.shadowColor=index===0?"#a78bfa":"transparent";ctx.shadowBlur=index===0?12:0;
          const x=part.x*cell+inset,y=part.y*cell+inset,w=cell-inset*2;
          ctx.beginPath();ctx.roundRect(x,y,w,w,6);ctx.fill();
        });
        ctx.shadowBlur=0;
      }
      function reset() {
        snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
        direction={x:1,y:0};nextDirection={x:1,y:0};score=0;
        food=placeFood();scoreEl.textContent=fa(score);draw();
      }
      function finish() {
        running=false;ended=true;clearInterval(timer);
        statusEl.textContent="بازی تموم شد! دوباره تلاش کن.";
        startButton.textContent="بازی دوباره";
      }
      function tick() {
        direction=nextDirection;
        const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
        const ate=head.x===food.x&&head.y===food.y;
        const body=ate?snake:snake.slice(0,-1);
        if(head.x<0||head.y<0||head.x>=size||head.y>=size||body.some(part=>part.x===head.x&&part.y===head.y)){finish();return;}
        snake.unshift(head);
        if(ate){
          score+=10;scoreEl.textContent=fa(score);food=placeFood();
          if(score>best){best=score;bestEl.textContent=fa(best);try{localStorage.setItem(bestKey,String(best));}catch{}}
        }else snake.pop();
        draw();
      }
      function start() {
        clearInterval(timer);reset();running=true;ended=false;
        statusEl.textContent="با کلیدهای جهت‌دار یا دکمه‌های پایین حرکت کن.";
        startButton.textContent="شروع دوباره";
        timer=setInterval(tick,125);
      }
      function steer(name) {
        const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
        const chosen=dirs[name];if(!chosen||!running)return;
        if(chosen.x!==-direction.x||chosen.y!==-direction.y)nextDirection=chosen;
      }
      startButton.addEventListener("click",start);
      document.querySelectorAll("[data-dir]").forEach(button=>button.addEventListener("click",()=>steer(button.dataset.dir)));
      window.addEventListener("keydown",event=>{
        const keys={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};
        const name=keys[event.key];if(name){event.preventDefault();steer(name);}
        if((event.key===" "||event.key==="Enter")&&!running){event.preventDefault();start();}
      });
      let touchStart=null;
      canvas.addEventListener("touchstart",event=>{const t=event.changedTouches[0];touchStart={x:t.clientX,y:t.clientY};},{passive:true});
      canvas.addEventListener("touchend",event=>{
        if(!touchStart)return;const t=event.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
        if(Math.max(Math.abs(dx),Math.abs(dy))>20)steer(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
        touchStart=null;
      },{passive:true});
      reset();
    })();
  </script>
</body>
</html>
